<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EquiWage Analytics</title>
    <script>
      try {
        const saved = localStorage.getItem('equiwage.theme');
        const theme = saved === 'dark' || saved === 'light' ? saved : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
    <script src="./mock-bridge.js"></script>
    <script type="module" crossorigin src="./assets/index-D9aOwiy5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Ds2svGPB.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-y: auto !important;
      }
      #root {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .min-h-screen {
        min-height: 100% !important;
      }
      /* Clean custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.32);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
